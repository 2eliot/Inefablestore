<!doctype html>
<html lang="es">
  <head>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1375784344514516');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1375784344514516&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_name|default('InefableStore') }}</title>
    <link rel="icon" href="{{ url_for('static', filename='561553627_18409264204136226_1099017029378111495_n.ico') }}" type="image/x-icon">
    <link rel="shortcut icon" href="{{ url_for('static', filename='561553627_18409264204136226_1099017029378111495_n.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    {% block styles %}
    <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
    {% endblock %}
  </head>
  <body class="{{ body_class|default('') }}">
    <div class="scale-wrap">
    {% block header %}
      <header class="topbar">
        <button id="admin-hamburger" class="btn-ghost" aria-label="Menú" title="Menú" style="margin-right:8px; display:none;">☰</button>
        <div class="brand">{{ site_name|default('InefableStore') }}</div>
      </header>
    {% endblock %}

    <main class="container">
      {% block content %}{% endblock %}
    </main>
    </div>
    <!-- Mobile drawer for admin tabs -->
    <aside id="admin-drawer" class="admin-drawer" hidden>
      <div class="drawer-backdrop"></div>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menú de administración">
        <nav id="admin-drawer-tabs" class="tabs" role="tablist" aria-label="Pestañas de administración (móvil)"></nav>
      </div>
    </aside>

    {% block scripts %}
    <script src="{{ static_url('js/admin.js') }}" defer></script>
    {% endblock %}
  </body>
</html>
