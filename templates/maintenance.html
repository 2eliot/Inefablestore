<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>En mantenimiento — {{ site_name|default('InefableStore') }}</title>
  <link rel="icon" href="{{ url_for('static', filename='561553627_18409264204136226_1099017029378111495_n.ico') }}" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #10b981; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      padding: 40px 28px;
      border-radius: 16px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(16, 185, 129, .12);
      border: 1px solid rgba(16, 185, 129, .4);
      font-size: 28px;
    }
    h1 { font-weight: 800; font-size: 22px; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0; }
    .brand {
      margin-top: 26px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Estamos mejorando la tienda</h1>
    <p>Volvemos en unos minutos. Gracias por tu paciencia — ya casi terminamos.</p>
    <div class="brand">{{ site_name|default('InefableStore') }}</div>
  </div>
</body>
</html>
