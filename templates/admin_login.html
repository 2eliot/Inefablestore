<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso al panel | {{ site_name }}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #0f1320; color: #e8ecf6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 22rem; background: #171c2e; border: 1px solid #262d45; border-radius: 14px; padding: 1.75rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.25rem; color: #aab3c8; font-size: .9rem; }
    label { display: block; font-size: .85rem; color: #aab3c8; margin: .9rem 0 .35rem; }
    input { width: 100%; padding: .7rem .8rem; border-radius: 9px; border: 1px solid #2f3857; background: #0f1320; color: inherit; font-size: 1rem; }
    input:focus { outline: 2px solid #4f7cff; outline-offset: 1px; }
    button { width: 100%; margin-top: 1.25rem; padding: .8rem; border: 0; border-radius: 9px; background: #4f7cff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: wait; }
    #msg { min-height: 1.2rem; margin: .9rem 0 0; font-size: .88rem; color: #ff8f8f; }
  </style>
</head>
<body>
  <main>
    <h1>Panel de administración</h1>
    <p class="sub">{{ site_name }}</p>
    <form id="f" autocomplete="on">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="b" type="submit">Entrar</button>
      <p id="msg" role="alert">{{ notice or "" }}</p>
    </form>
  </main>
  <script>
    const f = document.getElementById('f'), b = document.getElementById('b'), msg = document.getElementById('msg');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = ''; b.disabled = true;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: f.email.value.trim(), password: f.password.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok && data.user && data.user.role === 'admin') { location.replace('/admin'); return; }
        if (res.ok && data.ok) {
          await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' });
          msg.textContent = 'Esa cuenta no es de administrador.';
        } else {
          msg.textContent = data.error || (res.status === 429 ? 'Demasiados intentos. Espera un momento.' : 'No se pudo iniciar sesión.');
        }
      } catch (_) { msg.textContent = 'Sin conexión con el servidor.'; }
      b.disabled = false;
    });
  </script>
</body>
</html>
